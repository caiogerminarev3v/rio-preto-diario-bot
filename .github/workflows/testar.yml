name: Testar conexão com o Instagram

# Roda manualmente (Actions → "Testar conexão com o Instagram" → Run workflow).
# Só confere token, conta, fontes e Telegram — NÃO publica nada.

on:
  workflow_dispatch:

jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Testar Instagram
        env:
          IG_TOKEN_RIO_PRETO_DIARIO: ${{ secrets.IG_TOKEN_RIO_PRETO_DIARIO }}
          IG_USER_ID_RIO_PRETO_DIARIO: ${{ secrets.IG_USER_ID_RIO_PRETO_DIARIO }}
        run: python -m rpd testar-instagram --conta rio_preto_diario
      - name: Testar fontes de notícias
        run: python -m rpd fontes --conta rio_preto_diario
      - name: Testar Telegram (mostra o CHAT_ID)
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python -m rpd telegram-chats
      - name: Testar IA (Anthropic)
        if: always()
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python - <<'PY'
          import os
          if not os.environ.get("ANTHROPIC_API_KEY"):
              print("❌ ANTHROPIC_API_KEY não configurada"); raise SystemExit(0)
          from rpd import llm
          r = llm.pedir_json("Você testa conexões.", 'Responda {"ok": true, "msg": "IA conectada"}', max_tokens=50)
          print("✅", r.get("msg"), "| modelo:", llm.MODELO)
          PY
