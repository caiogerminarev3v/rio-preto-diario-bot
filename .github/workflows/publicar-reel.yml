name: Publicar Reels

# Publica um vídeo que já está no repositório (ex.: publicacoes/videos/arquivo.mp4)
# como Reels do Instagram (também aparece no feed).

on:
  workflow_dispatch:
    inputs:
      arquivo:
        description: "Caminho do vídeo no repositório (ex.: publicacoes/videos/video.mp4)"
        required: true
      legenda:
        description: "Legenda completa (use \\n para quebrar linha)"
        required: true

concurrency:
  group: redacao
  cancel-in-progress: false

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Publicar Reels
        env:
          IG_TOKEN_RIO_PRETO_DIARIO: ${{ secrets.IG_TOKEN_RIO_PRETO_DIARIO }}
          IG_USER_ID_RIO_PRETO_DIARIO: ${{ secrets.IG_USER_ID_RIO_PRETO_DIARIO }}
          REEL_ARQUIVO: ${{ github.event.inputs.arquivo }}
          REEL_LEGENDA: ${{ github.event.inputs.legenda }}
        run: python -m rpd reel --conta rio_preto_diario
