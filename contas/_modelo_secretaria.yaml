# ============================================================
#  MODELO PARA SECRETARIAS
#  1. Copie este arquivo para contas/sec_<nome>.yaml (sem o "_" no início)
#  2. Troque id, nome, arroba, cores, logo e as palavras do filtro
#  3. Crie os secrets IG_TOKEN_SEC_<NOME>, IG_USER_ID_SEC_<NOME>,
#     TELEGRAM_CHAT_ID_SEC_<NOME> e adicione-os no workflow redacao.yml
# ============================================================

id: sec_saude
nome: Secretaria de Saúde de Rio Preto
arroba: "@saude.riopreto"
ativo: false            # mude para true quando estiver tudo configurado

visual:
  logo: assets/sec_saude/logo.png
  cores:
    primaria: "#00594F"
    secundaria: "#007A6C"
    destaque: "#F2A900"
    texto: "#FFFFFF"
    urgente: "#C8102E"
  fonte_titulo: assets/fonts/Montserrat.ttf
  fonte_texto: assets/fonts/Inter.ttf

editorial:
  cidade: São José do Rio Preto
  publico: moradores de Rio Preto que usam os serviços de saúde do município
  tom: >
    Comunicação institucional e de serviço: clara, acolhedora, objetiva.
    Sempre destaque o que o cidadão precisa fazer (onde ir, horário, documentos).
    Nunca faça promoção pessoal de autoridades (art. 37, §1º da Constituição) —
    o foco é o serviço, não quem anunciou.
  hashtags_fixas: ["#RioPreto", "#SaudeRioPreto"]
  mix:
    local: 1.0
    brasil: 0.0

publicacao:
  local: aprovacao       # contas oficiais: SEMPRE com aprovação humana
  brasil: aprovacao
  sensiveis_sempre_aprovacao: true
  janela: ["08:00", "19:00"]
  intervalo_minimo_minutos: 120
  max_posts_por_dia: 4
  max_novas_pautas_por_ciclo: 2
  coletar_a_cada_minutos: 120

instagram:
  env_token: IG_TOKEN_SEC_SAUDE
  env_user_id: IG_USER_ID_SEC_SAUDE
  api_host: graph.facebook.com     # mesmo app/portfólio do Rio Preto Diário
  api_versao: v23.0
  renovar_token: false

telegram:
  env_bot_token: TELEGRAM_BOT_TOKEN
  env_chat_id: TELEGRAM_CHAT_ID_SEC_SAUDE   # grupo da equipe de comunicação da secretaria

fontes:
  - nome: Prefeitura de Rio Preto
    tipo: rss
    url: https://www.riopreto.sp.gov.br/feed/
    escopo: local
    usar_foto: true
    credito_foto: "Prefeitura de Rio Preto"
    idade_maxima_horas: 48
    filtro_palavras: [saúde, ubs, upa, vacina, vacinação, dengue, hospital, médico, consulta, exame, campanha]

  - nome: Ministério da Saúde (via Google Notícias)
    tipo: google_news
    consulta: '"Ministério da Saúde" campanha OR vacinação'
    escopo: brasil
    usar_foto: false

palavras_relevancia_local: [Rio Preto, UBS, UPA, Hospital de Base]
